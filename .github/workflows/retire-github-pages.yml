name: 旧GitHub Pagesを転送ページへ置換

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - legacy-pages/**
      - .github/workflows/retire-github-pages.yml

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: legacy-pages
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4
