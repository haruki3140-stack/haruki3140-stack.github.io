name: 毎日の自動更新

on:
  schedule:
    # 21:17 UTC = 翌 06:17 JST。毎時0分は予約が集中し、実測で2〜5時間遅れていたため分をずらす。
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      mock:
        description: 'ダミーデータで試す（認証情報なしでも動く）'
        type: boolean
        default: false
      sync_genres:
        description: '楽天APIからジャンル一覧を取り込み直す'
        type: boolean
        default: false

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      built: ${{ steps.pipeline.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: ランキングと記事の回帰テスト
        run: npm test

      - name: ジャンル一覧を楽天APIから同期
        if: ${{ inputs.sync_genres }}
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run genres

      - name: パイプライン実行（収集 → 記事生成 → サイト生成）
        id: pipeline
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
          SITE_AUTHOR: ${{ vars.SITE_AUTHOR }}
          SITE_CONTACT: ${{ vars.SITE_CONTACT }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          MOCK: ${{ inputs.mock && '1' || '0' }}
        run: npm run run

      - name: 収益化リンクを検査
        run: npm run stats:strict

      # 公開中の sitemap がまだ前回のものであるうちに、変わったURLだけを決めておく。
      - name: IndexNowで通知するURLを決める
        if: ${{ vars.HOSTING_PROVIDER == 'cloudflare' && !inputs.mock }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run indexnow:plan

      - name: 蓄積データをコミット
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: $(date -u +%Y-%m-%d) のランキングを記録"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # push を受けて Cloudflare Pages が公開し終えてから通知する（最大10分待つ）。
      - name: 公開を待ってIndexNowで通知
        if: ${{ vars.HOSTING_PROVIDER == 'cloudflare' && !inputs.mock && steps.commit.outputs.pushed == 'true' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run indexnow:send

      # Cloudflare Pagesへ移行後は二重デプロイを止める。
      # Repository variable HOSTING_PROVIDER=cloudflare で自動的にスキップされる。
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: ${{ vars.HOSTING_PROVIDER != 'cloudflare' }}
        with:
          path: public
          retention-days: 1

      - name: 失敗をGitHub Issueで通知
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[自動通知] 毎日の自動更新に失敗"
          body="毎日の自動更新に失敗しました。実行ログ: ${RUN_URL}"
          issue_number="$(gh issue list --repo "$REPOSITORY" --state open --search "$title in:title" --json number --jq ".[0].number // empty")"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          fi

  deploy:
    if: ${{ vars.HOSTING_PROVIDER != 'cloudflare' }}
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
