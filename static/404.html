<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>ページが見つかりません | 楽天ランキング速報</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f8;
        color: #202124;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 3rem 1.5rem;
        text-align: center;
      }
      .status {
        margin: 0;
        color: #bf0000;
        font-size: clamp(4rem, 16vw, 7rem);
        font-weight: 800;
        line-height: 1;
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        color: #5f6368;
        line-height: 1.8;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.25rem;
        border-radius: 999px;
        background: #bf0000;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #f6a800;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status" aria-hidden="true">404</p>
      <h1>ページが見つかりません</h1>
      <p>URLが変更されたか、ページが削除された可能性があります。</p>
      <a href="/">楽天ランキング速報のトップへ戻る</a>
    </main>
  </body>
</html>
